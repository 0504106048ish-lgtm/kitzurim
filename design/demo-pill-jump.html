<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גלולה בלי פס</title>
<style>
  :root { --bg:#0b0d12; --card:#151922; --text:#e9edf5; --muted:#8b94a7; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, "Segoe UI", Arial, sans-serif; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; max-width:760px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; max-width:1100px; }
  .card { background:var(--card); border-radius:18px; padding:14px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  .phone { position:relative; height:200px; border-radius:16px; overflow:hidden; direction:ltr; }
  .app1 { background:linear-gradient(180deg, #e8eef7 0, #dbe4f0 100%); }
  .app2 { background:linear-gradient(160deg, #ff6b8b, #f7b267); }
  .status { position:absolute; top:9px; left:14px; right:14px; display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; z-index:1; }
  .app1 .status { color:#111; } .app2 .status { color:#fff; }
  .fake { position:absolute; top:52px; left:14px; right:14px; }
  .fake div { height:12px; border-radius:6px; background:rgba(0,0,0,.12); margin-bottom:10px; }
  .app2 .fake div { background:rgba(255,255,255,.35); }
  .hole { position:absolute; top:10px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:#0a0a0a; z-index:5; }
  .bg { position:absolute; top:1px; left:50%; transform:translateX(-50%); width:34px; height:34px; border-radius:17px; background:#000; border:1.5px solid #25D366; box-sizing:border-box; opacity:0; z-index:2; }
  .content { position:absolute; top:1px; left:50%; transform:translateX(-50%); height:34px; display:flex; align-items:center; z-index:4; opacity:0; font-size:12.5px; white-space:nowrap; padding:0 10px; }
  .side { display:flex; align-items:center; gap:5px; overflow:hidden; }
  .side.l { justify-content:flex-end; } .side.r { justify-content:flex-start; }
  .side.l span { color:#d2d8e4; overflow:hidden; text-overflow:ellipsis; }
  .side.r b { color:#fff; }
  .dot { width:20px; height:20px; border-radius:50%; background:#25D366; color:#000; font-weight:bold; font-size:11px; display:flex; align-items:center; justify-content:center; flex:none; }
  button { margin-top:10px; width:100%; padding:10px; border:0; border-radius:12px; background:#232a38; color:var(--text); font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<h1>בלי פס שחור</h1>
<p class="sub">רק הגלולה עצמה שחורה. כל השאר שקוף: רואים את האפליקציה שמתחת, והשעה והסוללה האמיתיות של הטלפון נשארות במקום, כי הגלולה נעצרת לפניהן.</p>
<div class="grid">
  <div class="card"><h2>באפליקציה בהירה</h2>
    <div class="phone app1" id="p1"><div class="status"><span>13:25</span><span>81% ▮</span></div>
      <div class="fake"><div style="width:70%"></div><div></div><div style="width:85%"></div><div style="width:60%"></div></div>
      <div class="hole"></div><div class="bg"></div><div class="content"></div></div>
    <button onclick="play('p1','msg')">💬 הודעה</button>
    <button onclick="play('p1','charge')">⚡ מטען</button>
  </div>
  <div class="card"><h2>באפליקציה צבעונית</h2>
    <div class="phone app2" id="p2"><div class="status"><span>13:25</span><span>81% ▮</span></div>
      <div class="fake"><div style="width:70%"></div><div></div><div style="width:85%"></div><div style="width:60%"></div></div>
      <div class="hole"></div><div class="bg"></div><div class="content"></div></div>
    <button onclick="play('p2','msg')">💬 הודעה</button>
    <button onclick="play('p2','charge')">⚡ מטען</button>
  </div>
</div>
<script>
const GAP = 30, wait = ms => new Promise(r => setTimeout(r, ms));
function anim(el, f, ms, e) { return el.animate(f, { duration: ms, easing: e || 'ease-out', fill: 'forwards' }).finished; }
let busy = {};
async function play(id, type) {
  if (busy[id]) return; busy[id] = true;
  const ph = document.getElementById(id), bg = ph.querySelector('.bg'), c = ph.querySelector('.content');
  // רוחב עד הרווח שבין השעה לסוללה
  const sideW = Math.floor((ph.clientWidth - 2 * 62 - GAP - 20) / 2);
  const color = type === 'msg' ? '#25D366' : '#3ed18c';
  bg.style.borderColor = color;
  c.innerHTML = type === 'msg'
    ? '<div class="side l" style="width:' + sideW + 'px"><span>מה קורה? מגיע היום?</span></div><div style="width:' + GAP + 'px"></div><div class="side r" style="width:' + sideW + 'px"><b>דני</b><div class="dot">ד</div></div>'
    : '<div class="side l" style="width:' + sideW + 'px"><b style="color:#3ed18c;font-size:12px">⚡ 81%</b></div><div style="width:' + GAP + 'px"></div><div class="side r" style="width:' + sideW + 'px"><span style="color:#fff;font-size:11px">מלאה בעוד 1:10 שע׳</span></div>';
  const full = 2 * sideW + GAP + 20;
  bg.style.opacity = 1;
  await anim(bg, [{ width: '34px' }, { width: full + 5 + 'px', offset: .75 }, { width: full + 'px' }], 420);
  await anim(c, [{ opacity: 0 }, { opacity: 1 }], 180);
  await wait(2200);
  await anim(c, [{ opacity: 1 }, { opacity: 0 }], 120);
  await anim(bg, [{ width: full + 'px' }, { width: '34px' }], 240, 'ease-in');
  bg.style.opacity = 0; bg.getAnimations().forEach(a => a.cancel()); c.getAnimations().forEach(a => a.cancel());
  busy[id] = false;
}
</script>
</body>
</html>
