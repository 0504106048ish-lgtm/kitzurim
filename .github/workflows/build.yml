name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Publish release for phone download
        run: |
          cp app/build/outputs/apk/release/app-release.apk Kitzurim.apk
          gh release create "v${{ github.run_number }}" Kitzurim.apk \
            --title "קיצורים ${{ github.run_number }}" \
            --notes "$NOTES" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
